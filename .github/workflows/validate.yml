name: Validate extension

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/content-script.js
          node --check chrome-extension/popup.js
          node --check chrome-extension/manager.js
      - name: Validate manifest and Python tools
        run: |
          python -m json.tool chrome-extension/manifest.json >/dev/null
          python -m py_compile linkedin_scraper.py merge_outputs.py analyze_report.py
      - name: Build extension archive
        run: ./scripts/package_extension.sh
